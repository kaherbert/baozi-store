spring.application.name=baozi-store
server.port=8080

# ---------- Banco de dados H2 (em memoria) ----------
# DB_CLOSE_DELAY=-1 evita que o banco seja apagado enquanto a aplicacao estiver rodando.
# Os dados sao perdidos quando a aplicacao e encerrada (normal para o H2 em memoria).
spring.datasource.url=jdbc:h2:mem:baozidb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# "update": o Hibernate cria/atualiza as tabelas sozinho a partir das entidades
spring.jpa.hibernate.ddl-auto=update
# Mostra no console o SQL que o Hibernate executa
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Mensagens de erro em JSON (aparecem no Postman) ----------
server.error.include-message=always
server.error.include-binding-errors=always